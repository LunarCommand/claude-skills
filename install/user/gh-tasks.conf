# Task boards for the lunar plugin's gh-tasks skill.
# Copy to ~/.claude/gh-tasks.conf and add one row per repository.
#
# Most projects need no rows at all. A Project linked to a repository is found
# with no configuration:
#
#     gh project link <number> --owner <owner> --repo <owner>/<repo>
#
# This file covers the case linking cannot express. GitHub allows a Project to
# be linked only to repositories under the same owner, so a workspace whose
# board and code repositories sit in different organizations has no link to
# read. It also disambiguates a repository that is linked to several boards.
#
# One row per repository, whitespace-separated:
#
#     <owner>/<repo>   <board owner>   <board number>   [private|public]
#
# The fourth column is the visibility the workspace EXPECTS. It is checked
# against what the board actually holds and a mismatch is reported, so it is
# worth setting: it catches a repository whose visibility changed under you, in
# either direction. Omit it and no check is made.
#
# Lines beginning with # are ignored. Example:
#
#     my-org/service-api      my-org          3       private
#     my-org/service-web      my-org          3       private
